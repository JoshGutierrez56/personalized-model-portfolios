name: Public validation fixtures

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  independent-fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned research and reporting environment
        run: python -m pip install -r requirements.txt
      - name: Run hand-derived and adversarial tests without licensed data
        run: python -m pytest -q -W error
