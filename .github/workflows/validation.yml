name: Public validation fixtures

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  independent-fixtures:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install pinned research and reporting environment
        run: python -m pip install -r requirements.txt
      - name: Run hand-derived and adversarial tests without licensed data
        run: python -m pytest -q -W error
      - name: Run the clearly artificial public walkthrough
        run: python run_public_demo.py --no-write
      - name: Check public evidence consistency and rebuild the dashboard
        run: python build_oversight_dashboard.py
      - name: Verify the committed dashboard matches its evidence
        run: git diff --exit-code -- docs/index.html
